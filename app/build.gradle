plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.multiusershare'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.multiusershare'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
